<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roles</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* =========================================
       Roles Page Specific Styling
    ========================================= */

    .roles-wrapper {
      max-width: 1000px;
      margin: 3rem auto;
      text-align: center;
    }

    .roles-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .role-badge {
      position: relative;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 200ms ease, box-shadow 200ms ease;
      color: white;
      font-size: 0.9rem;
    }

    .role-badge:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    /* Tooltip */
    .role-badge::after {
      content: attr(data-description);
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      width: 220px;
      font-size: 0.8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .role-badge:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    /* Role Colors */

    .owner { background: linear-gradient(135deg, #ff4d4d, #b30000); }
    .manager { background: linear-gradient(135deg, #ff7a18, #ffb347); }
    .admin { background: linear-gradient(135deg, #4f46e5, #6366f1); }
    .senior-mod { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
    .mod { background: linear-gradient(135deg, #10b981, #059669); }
    .junior-mod { background: linear-gradient(135deg, #84cc16, #65a30d); }

    .epic { background: linear-gradient(135deg, #a855f7, #7e22ce); }
    .majestic { background: linear-gradient(135deg, #ec4899, #be185d); }
    .vip { background: linear-gradient(135deg, #facc15, #eab308); color: #111; }
    .default { background: #6b7280; }

  </style>
</head>
<body>

  <div class="roles-wrapper">
    <h1>Server Roles</h1>
    <p>Hover over a role to see its description.</p>

    <div class="roles-grid">

      <!-- Staff Roles -->
      <div class="role-badge owner"
        data-description="Owner of the server. Full control over everything. Assists all staff members.">
        Owner
      </div>

      <div class="role-badge manager"
        data-description="Manages server operations and staff coordination. Staff assist each other.">
        Manager
      </div>

      <div class="role-badge admin"
        data-description="Handles administrative tasks, moderation, and enforcement. Staff assist each other.">
        Admin
      </div>

      <div class="role-badge senior-mod"
        data-description="Experienced moderator overseeing moderation team. Staff assist each other.">
        Senior Moderator
      </div>

      <div class="role-badge mod"
        data-description="Ensures rules are followed and assists members. Staff assist each other.">
        Moderator
      </div>

      <div class="role-badge junior-mod"
        data-description="Entry-level moderator learning moderation responsibilities. Staff assist each other.">
        Junior Moderator
      </div>

      <!-- Member Roles -->
      <div class="role-badge epic"
        data-description="Premium member with exclusive perks and cosmetic benefits.">
        Epic
      </div>

      <div class="role-badge majestic"
        data-description="High-tier premium member with enhanced perks.">
        Majestic
      </div>

      <div class="role-badge vip"
        data-description="VIP member with special chat color and minor perks.">
        VIP
      </div>

      <div class="role-badge default"
        data-description="Standard member role with basic access.">
        Default
      </div>

    </div>
  </div>

</body>
        </html>
