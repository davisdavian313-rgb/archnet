<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arch Network — Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: #f0f4ff;
      background: linear-gradient(135deg, #0b1026, #1a1f4b, #3b1f6b);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
    }
    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    header {
      background: rgba(0,0,0,0.4);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    header a {
      color: #9adfff;
      text-decoration: none;
      font-weight: 600;
    }
    main {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      font-size: 2.2em;
      background: linear-gradient(90deg, #fff, #cfe7ff, #bfa7ff, #9adfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #b9c3ff;
      line-height: 1.6;
    }
    .store-link {
      display: inline-block;
      margin: 20px 0;
      padding: 14px 24px;
      background: rgba(138,92,255,0.15);
      border: 1px solid rgba(138,92,255,0.35);
      border-radius: 12px;
      color: #8a5cff;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .store-link:hover {
      background: rgba(138,92,255,0.25);
      transform: translateY(-2px);
    }
    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #b9c3ff;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Back to Home</a>
  </header>

  <main>
    <h1>🛒 Arch Network Store</h1>
    <p>Support Arch Network and unlock exclusive perks, ranks, and items by visiting our official store.</p>
    <a class="store-link" href="https://archnetwork.base44.app/Store" target="_blank">Visit Store</a>
    <footer>
      🏰 Thank you for supporting Arch Network — your contributions help keep the community thriving.
    </footer>
  </main>
</body>
</html>
